<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Magic Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:1200px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:30px;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:42px;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:30px;
}

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
}

.upload-box{
    border:2px dashed rgba(255,255,255,.5);
    border-radius:20px;
    height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.upload-box:hover{
    background:rgba(255,255,255,.08);
}

.upload-box img{
    max-width:100%;
    max-height:280px;
    border-radius:15px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
    resize:none;
    font-size:15px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    color:#2575fc;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.result{
    height:450px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    border-radius:15px;
    background:rgba(255,255,255,.08);
}

.result img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@media(max-width:900px){
    .main{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>✨ AI Image Magic Studio</h1>
<p class="subtitle">Upload an image and transform it using AI prompts</p>

<div class="main">

<div class="card">

<label class="upload-box" for="imageInput">
    <span id="uploadText">
        📸 Click to Upload Image
    </span>
    <img id="preview" style="display:none;">
</label>

<input type="file" id="imageInput" hidden accept="image/*">

<textarea id="prompt"
placeholder="Example:
Remove background
Make ecommerce photo
Change to cartoon style
Add luxury studio lighting"></textarea>

<button onclick="editImage()">
🚀 Generate AI Edit
</button>

</div>

<div class="card">
<h2 style="margin-bottom:15px;">Generated Result</h2>

<div class="result">
<img id="resultImage"
src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000"
alt="">
</div>

</div>

</div>

</div>

<script>

const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const uploadText=document.getElementById("uploadText");

imageInput.addEventListener("change",function(){
    const file=this.files[0];

    if(file){
        preview.src=URL.createObjectURL(file);
        preview.style.display="block";
        uploadText.style.display="none";
    }
});

async function editImage(){

    const prompt=document.getElementById("prompt").value;

    alert(
        "Prompt: " + prompt +
        "\\n\\nConnect your AI image editing API here."
    );

    // API Integration Example:
    // Upload image
    // Send prompt
    // Receive edited image URL
    // resultImage.src = response.imageUrl;

}

</script>

</body>
</html>
